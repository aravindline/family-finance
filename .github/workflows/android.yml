# Builds the Finance Reminders Android app (android/ folder) and puts the APK on the Releases page.
# Runs by itself when the android folder is uploaded or changed, or by hand: Actions > Build reminder app > Run workflow.
# No secrets needed.
name: Build reminder app
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: |
          V=$(grep versionName android/app/build.gradle | grep -o "'[^']*'" | tr -d "'")
          echo "V=$V" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "Finance-Reminders-$V.apk"
      - uses: actions/upload-artifact@v4
        with: { name: Finance-Reminders-APK, path: 'Finance-Reminders-*.apk' }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete "reminders-v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "reminders-v$V" "Finance-Reminders-$V.apk" --title "Finance Reminders $V" --notes "Reminder checklist for Family Finance. Open this page on the phone, tap the .apk and install."
